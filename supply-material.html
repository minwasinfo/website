<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sell Plastic Waste — Minwas Advanced Recycling</title>
<meta name="description" content="Supply non-recyclable plastic waste to Minwas Advanced Recycling's pyrolysis plant in Vijayapura, Karnataka. Bulk collection, documentation, and scheduled pickups.">
<link rel="canonical" href="https://minwasinfo.github.io/website/supply-material.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Minwas Advanced Recycling">
<meta property="og:title" content="Sell Plastic Waste — Minwas Advanced Recycling">
<meta property="og:description" content="Supply non-recyclable plastic waste to our pyrolysis plant in Vijayapura, Karnataka. Bulk collection, documentation, and scheduled pickups.">
<meta property="og:url" content="https://minwasinfo.github.io/website/supply-material.html">
<meta property="og:image" content="https://minwasinfo.github.io/website/assets/images/logo.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Sell Plastic Waste — Minwas Advanced Recycling">
<meta name="twitter:description" content="Supply non-recyclable plastic waste to our pyrolysis plant in Vijayapura, Karnataka. Bulk collection, documentation, and scheduled pickups.">
<meta name="twitter:image" content="https://minwasinfo.github.io/website/assets/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/images/logo.png">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>

<header id="site-header"></header>

<main>

  <div class="pagehead">
    <div class="wrap">
      <div class="breadcrumb"><a href="index.html">Home</a> / <span data-content="page.crumb"></span></div>
      <h1 data-content="page.title"></h1>
      <p data-content="page.intro"></p>
    </div>
  </div>

  <section class="section">
    <div class="wrap content-form-grid">
      <div>

        <h2 style="margin-bottom:1rem;" data-content="materialsHeading"></h2>
        <div class="sample-grid">
          <template data-repeat="acceptedMaterials">
            <div class="sample-card">
              <div class="sample-image" data-illus="{{image}}" data-size="88"></div>
              <div class="sample-caption"><h3>{{name}}</h3><p>{{form}}</p></div>
            </div>
          </template>
        </div>
        <p style="font-size:0.82rem; margin-bottom:2.25rem;" data-content="materialsFootnote"></p>

        <h3 style="margin-bottom:0.9rem;" data-content="notAcceptedHeading"></h3>
        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr><th>Material</th><th>Typical form</th><th></th></tr>
            </thead>
            <tbody>
              <template data-repeat="notAcceptedMaterials">
                <tr><td>{{name}}</td><td>{{form}}</td><td><span class="tag-no">✕ Not accepted</span>{{noteHtml}}</td></tr>
              </template>
            </tbody>
          </table>
        </div>

        <h2 style="margin:2.75rem 0 1rem;" data-content="qualityHeading"></h2>
        <p style="max-width:640px; margin-bottom:1.5rem;" data-content="qualityIntro"></p>
        <div class="grid-2" style="gap:1.25rem;">
          <template data-repeat="qualityPoints">
            <div class="card"><h3>{{title}}</h3><p>{{body}}</p></div>
          </template>
        </div>

        <h2 style="margin:2.75rem 0 1rem;" data-content="processHeading"></h2>
        <div class="steps-row" style="grid-template-columns:repeat(4,1fr);">
          <template data-repeat="steps">
            <div class="step"><div class="step-index">{{index}}</div><h3>{{title}}</h3><p>{{body}}</p></div>
          </template>
        </div>

        <div class="callout" style="margin-top:2.5rem;">
          <strong data-content="minLoadCallout.label"></strong>
          <span data-content="minLoadCallout.body"></span>
        </div>
      </div>

      <div class="sticky-form">
        <h2 style="margin-bottom:0.3rem;" data-content="form.heading"></h2>
        <p style="font-size:0.88rem; margin-bottom:1.4rem;" data-content="form.responseNote"></p>
        <form class="enquiry-form form-grid" method="POST">
          <input type="checkbox" name="botcheck" class="hp-field" tabindex="-1" autocomplete="off">
          <input type="hidden" name="subject" value="Raw Material Supply Enquiry — Minwas Advanced Recycling">
          <input type="hidden" name="form_type" value="Supply plastic waste">

          <div class="form-group">
            <label>Your name</label>
            <input type="text" name="name" placeholder="Full name" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Company / organisation</label>
              <input type="text" name="company" placeholder="Optional">
            </div>
            <div class="form-group">
              <label>Supplier type</label>
              <select name="supplier_type" required>
                <option value="">Select…</option>
                <option>Industry / factory</option>
                <option>Municipality / civic body</option>
                <option>Scrap dealer / aggregator</option>
                <option>Individual</option>
                <option>Other</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Phone / WhatsApp</label>
              <input type="tel" name="phone" inputmode="tel" placeholder="+91 XXXXX XXXXX" pattern="\+?[0-9\s\-]{7,20}" title="Phone number: digits only, optional leading + for country code" required>
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" name="email" placeholder="your@email.com">
            </div>
          </div>
          <div class="form-group">
            <label>Material type</label>
            <div class="checkbox-row">
              <template data-repeat="materialCheckboxes">
                <label class="checkbox-chip"><input type="checkbox" name="material[]" value="{{value}}"> {{label}}</label>
              </template>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Approx. quantity</label>
              <input type="text" name="quantity" placeholder="e.g. 5 tonnes/month">
            </div>
            <div class="form-group">
              <label>Frequency</label>
              <select name="frequency">
                <option value="">Select…</option>
                <option>One-time load</option>
                <option>Recurring / scheduled</option>
                <option>Not sure yet</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Location / district</label>
            <input type="text" name="location" placeholder="City, district, state">
          </div>
          <div class="form-group">
            <label>Message</label>
            <textarea name="message" placeholder="Anything else — packaging, contamination level, preferred pickup dates, etc."></textarea>
          </div>
          <div class="h-captcha" data-captcha="true"></div>
          <button type="submit" class="btn btn-primary btn-block" data-content="form.submitLabel"></button>
          <div class="form-status" role="status" aria-live="polite"></div>
        </form>
      </div>
    </div>
  </section>

</main>

<footer id="site-footer"></footer>
<div id="quick-contact"></div>

<script src="assets/js/site-data.js"></script>
<script src="assets/js/analytics.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/illustrations.js"></script>
<script src="content/supply-material.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/forms.js"></script>
<script src="https://web3forms.com/client/script.js" async defer></script>
<script>
  document.addEventListener("DOMContentLoaded", () => Render.mount(window.CONTENT));
</script>
</body>
</html>
