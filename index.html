<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minwas Advanced Recycling Pvt Ltd — Plastic Pyrolysis Plant, Karnataka</title>
<meta name="description" content="Minwas Advanced Recycling operates a plastic pyrolysis plant in Vijayapura, Karnataka — buying non-recyclable plastic waste and supplying pyrolysis fuel oil and carbon black.">
<link rel="canonical" href="https://www.minwas.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Minwas Advanced Recycling">
<meta property="og:title" content="Minwas Advanced Recycling Pvt Ltd — Plastic Pyrolysis Plant, Karnataka">
<meta property="og:description" content="We buy non-recyclable plastic waste and supply pyrolysis fuel oil and carbon black, direct from our plant in Vijayapura, Karnataka.">
<meta property="og:url" content="https://www.minwas.com/">
<meta property="og:image" content="https://www.minwas.com/assets/images/logo.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Minwas Advanced Recycling Pvt Ltd — Plastic Pyrolysis Plant, Karnataka">
<meta name="twitter:description" content="We buy non-recyclable plastic waste and supply pyrolysis fuel oil and carbon black, direct from our plant in Vijayapura, Karnataka.">
<meta name="twitter:image" content="https://www.minwas.com/assets/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/images/logo.png">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>

<header id="site-header"></header>

<main>

  <!-- HERO -->
  <section class="hero">
    <div class="wrap hero-inner">
      <div>
        <span class="badge" data-content="hero.badge"></span>
        <h1 data-content="hero.titleHtml" data-content-html></h1>
        <p class="hero-desc" data-content="hero.desc"></p>
        <div class="hero-ctas">
          <a class="btn btn-primary" href="supply-material.html" data-content="hero.ctaSupply"></a>
          <a class="btn btn-accent2" href="buy-products.html" data-content="hero.ctaBuy"></a>
        </div>
      </div>
      <div>
        <svg class="process-diagram" viewBox="0 0 420 400" role="img" aria-label="Process flow: plastic waste into a pyrolysis reactor, producing fuel oil, carbon black, and recycled gas">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 Z" fill="#4c7c34"></path>
            </marker>
          </defs>
          <g fill="none" stroke="#4c7c34" stroke-width="1.5">
            <line x1="210" y1="64" x2="210" y2="100" marker-end="url(#arrow)"></line>
            <line x1="210" y1="164" x2="210" y2="184" stroke="#4c7c34"></line>
            <line x1="90" y1="184" x2="330" y2="184"></line>
            <line x1="90" y1="184" x2="90" y2="220" marker-end="url(#arrow)"></line>
            <line x1="210" y1="184" x2="210" y2="220" marker-end="url(#arrow)"></line>
            <line x1="330" y1="184" x2="330" y2="220" marker-end="url(#arrow)"></line>
          </g>
          <g>
            <rect x="40" y="8" width="340" height="56" rx="2" fill="#ffffff" stroke="#c8d4bd"></rect>
            <text x="210" y="32" text-anchor="middle" fill="#262521" font-size="13" font-weight="600" font-family="IBM Plex Mono, monospace">PLASTIC WASTE FEEDSTOCK</text>
            <text x="210" y="50" text-anchor="middle" fill="#666a5f" font-size="10.5" font-family="IBM Plex Mono, monospace">Shredded, dried, sorted</text>

            <rect x="40" y="100" width="340" height="64" rx="2" fill="#e3ecdc" stroke="#4c7c34" stroke-width="1.5"></rect>
            <text x="210" y="127" text-anchor="middle" fill="#262521" font-size="13.5" font-weight="600" font-family="IBM Plex Mono, monospace">PYROLYSIS REACTOR</text>
            <text x="210" y="147" text-anchor="middle" fill="#4a5a45" font-size="10.5" font-family="IBM Plex Mono, monospace">400–500°C · sealed · oxygen-free</text>

            <rect x="40" y="220" width="100" height="66" rx="2" fill="#ffffff" stroke="#c8d4bd"></rect>
            <text x="90" y="248" text-anchor="middle" fill="#262521" font-size="11.5" font-weight="600" font-family="IBM Plex Mono, monospace">FUEL OIL</text>
            <text x="90" y="264" text-anchor="middle" fill="#666a5f" font-size="9.5" font-family="IBM Plex Mono, monospace">condensed</text>

            <rect x="160" y="220" width="100" height="66" rx="2" fill="#ffffff" stroke="#c8d4bd"></rect>
            <text x="210" y="248" text-anchor="middle" fill="#262521" font-size="11.5" font-weight="600" font-family="IBM Plex Mono, monospace">CARBON</text>
            <text x="210" y="262" text-anchor="middle" fill="#262521" font-size="11.5" font-weight="600" font-family="IBM Plex Mono, monospace">BLACK</text>

            <rect x="280" y="220" width="100" height="66" rx="2" fill="#ffffff" stroke="#c8d4bd"></rect>
            <text x="330" y="248" text-anchor="middle" fill="#262521" font-size="11.5" font-weight="600" font-family="IBM Plex Mono, monospace">GAS</text>
            <text x="330" y="264" text-anchor="middle" fill="#666a5f" font-size="9.5" font-family="IBM Plex Mono, monospace">Internal use</text>
          </g>
        </svg>
        <p style="font-size:0.78rem; color:var(--muted); font-style:italic; margin-top:0.6rem;" data-content="hero.diagramCaption"></p>
      </div>
    </div>
    <div class="wrap">
      <div class="fact-strip">
        <template data-repeat="facts">
          <div class="fact"><div class="fact-num">{{num}}<span>{{unit}}</span></div><div class="fact-label">{{label}}</div></div>
        </template>
      </div>
    </div>
  </section>

  <div class="hazard-divider"></div>

  <!-- WHO WE SERVE -->
  <section class="split-panel">
    <div class="panel panel-a">
      <div class="panel-tag" data-content="panelSupplier.tag"></div>
      <h2 data-content="panelSupplier.title"></h2>
      <p data-content="panelSupplier.desc"></p>
      <ul class="panel-list">
        <template data-repeat="supplierPoints"><li>{{text}}</li></template>
      </ul>
      <a class="btn btn-outline-light" href="supply-material.html" data-content="panelSupplier.cta"></a>
    </div>
    <div class="panel panel-b">
      <div class="panel-tag" style="color:var(--accent2-deep);" data-content="panelBuyer.tag"></div>
      <h2 data-content="panelBuyer.title"></h2>
      <p data-content="panelBuyer.desc"></p>
      <ul class="panel-list">
        <template data-repeat="buyerPoints"><li>{{text}}</li></template>
      </ul>
      <a class="btn btn-outline" href="buy-products.html" data-content="panelBuyer.cta"></a>
    </div>
  </section>

  <!-- PROCESS -->
  <section class="section">
    <div class="wrap">
      <div class="eyebrow" data-content="processIntro.eyebrow"></div>
      <h2 data-content="processIntro.title"></h2>
      <div class="steps-row">
        <template data-repeat="steps">
          <div class="step"><div class="step-index">{{index}}</div><h3>{{title}}</h3><p>{{body}}</p></div>
        </template>
      </div>
    </div>
  </section>

  <!-- MATERIALS TEASER -->
  <section class="section section-panel">
    <div class="wrap">
      <div class="eyebrow" data-content="materialsIntro.eyebrow"></div>
      <h2 data-content="materialsIntro.title"></h2>
      <p style="max-width:640px;" data-content="materialsIntro.desc"></p>
      <div class="tile-grid">
        <template data-repeat="materialTiles">
          <div class="tile"><div class="icon-tile" data-icon="{{icon}}" data-size="22"></div><h3>{{title}}</h3><p>{{desc}}</p></div>
        </template>
      </div>
      <p style="margin-top:1.75rem;"><a class="btn btn-outline" href="supply-material.html" data-content="materialsIntro.ctaLabel"></a></p>
    </div>
  </section>

  <!-- WHY US -->
  <section class="section">
    <div class="wrap">
      <div class="eyebrow" data-content="whyIntro.eyebrow"></div>
      <h2 data-content="whyIntro.title"></h2>
      <div class="tile-grid">
        <template data-repeat="whyTiles">
          <div class="tile"><div class="icon-tile" data-icon="{{icon}}" data-size="22"></div><h3>{{title}}</h3><p>{{desc}}</p></div>
        </template>
      </div>
    </div>
  </section>

  <!-- CTA -->
  <section class="section-tight section-tint">
    <div class="wrap" style="text-align:center;">
      <h2 style="margin-bottom:0.6rem;" data-content="closingCta.title"></h2>
      <p style="margin:0 auto 1.4rem; max-width:480px;" data-content="closingCta.desc"></p>
      <a class="btn btn-primary" href="contact.html" data-content="closingCta.buttonLabel"></a>
    </div>
  </section>

</main>

<footer id="site-footer"></footer>
<div id="quick-contact"></div>

<script src="assets/js/site-data.js"></script>
<script src="assets/js/analytics.js"></script>
<script src="assets/js/icons.js"></script>
<script src="content/home.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/forms.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => Render.mount(window.CONTENT));
</script>
</body>
</html>
