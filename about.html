<body>

<header id="site-header"></header>

<main>

  <div class="pagehead">
    <div class="wrap">
      <div class="breadcrumb"><a href="index.html">Home</a> / <span data-content="page.crumb"></span></div>
      <h1 data-content="page.title"></h1>
      <p data-content="page.intro"></p>
    </div>
  </div>

  <section class="section">
    <div class="wrap" style="max-width:760px;">
      <div class="eyebrow" data-content="mission.eyebrow"></div>
      <h2 style="margin-bottom:1rem;" data-content="mission.title"></h2>
      <p style="font-size:1rem;" data-content="mission.body"></p>
    </div>
  </section>

  <section class="section section-panel">
    <div class="wrap">
      <div class="eyebrow" data-content="loopDiagram.eyebrow"></div>
      <h2 style="margin-bottom:0.8rem;" data-content="loopDiagram.title"></h2>
      <p style="max-width:640px; margin-bottom:2rem;" data-content="loopDiagram.intro"></p>

      <div class="diagram-scroll">
      <svg class="loop-diagram" viewBox="0 0 900 420" role="img" aria-label="Diagram: fossil fuel becomes plastic, then products, then waste; Minwas converts waste into pyrolysis oil, which either fuels industry or returns to refineries as feedstock instead of virgin fossil fuel">
        <defs>
          <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8f9389"/></marker>
          <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4c7c34"/></marker>
          <marker id="arrow-brown" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8b5a2b"/></marker>
        </defs>

        <!-- linear "take-make-waste" chain: grey -->
        <g fill="none" stroke="#8f9389" stroke-width="1.6">
          <line x1="190" y1="50" x2="234" y2="50" marker-end="url(#arrow-slate)"/>
          <line x1="410" y1="50" x2="454" y2="50" marker-end="url(#arrow-slate)"/>
          <line x1="630" y1="50" x2="674" y2="50" marker-end="url(#arrow-slate)"/>
        </g>
        <!-- our process + the loop it closes: green -->
        <g fill="none" stroke="#4c7c34" stroke-width="2">
          <line x1="765" y1="80" x2="765" y2="144" marker-end="url(#arrow-green)"/>
          <line x1="765" y1="210" x2="765" y2="234" marker-end="url(#arrow-green)"/>
          <line x1="680" y1="270" x2="416" y2="270" marker-end="url(#arrow-green)"/>
          <line x1="325" y1="240" x2="325" y2="86" marker-end="url(#arrow-green)"/>
        </g>
        <!-- oil to industry as fuel: brown, terminal -->
        <g fill="none" stroke="#8b5a2b" stroke-width="1.8">
          <line x1="765" y1="300" x2="765" y2="324" marker-end="url(#arrow-brown)"/>
        </g>

        <!-- top row: linear economy -->
        <g font-family="IBM Plex Mono, monospace" text-anchor="middle">
          <rect x="20" y="20" width="170" height="60" rx="2" fill="#ffffff" stroke="#c7cabf"/>
          <text x="105" y="46" fill="#262521" font-size="12.5" font-weight="600">FOSSIL FUEL</text>
          <text x="105" y="64" fill="#8f9389" font-size="9.5">Virgin extraction</text>

          <rect x="240" y="20" width="170" height="60" rx="2" fill="#ffffff" stroke="#c7cabf"/>
          <text x="325" y="46" fill="#262521" font-size="12.5" font-weight="600">PLASTIC</text>
          <text x="325" y="64" fill="#8f9389" font-size="9.5">Resin production</text>

          <rect x="460" y="20" width="170" height="60" rx="2" fill="#ffffff" stroke="#c7cabf"/>
          <text x="545" y="46" fill="#262521" font-size="12.5" font-weight="600">PRODUCTS</text>
          <text x="545" y="64" fill="#8f9389" font-size="9.5">Packaging, bottles…</text>

          <rect x="680" y="20" width="170" height="60" rx="2" fill="#ffffff" stroke="#c7cabf"/>
          <text x="765" y="46" fill="#262521" font-size="12.5" font-weight="600">WASTE</text>
          <text x="765" y="64" fill="#8f9389" font-size="9.5">End of life</text>

          <!-- minwas: emphasized -->
          <rect x="680" y="150" width="170" height="60" rx="2" fill="#e3ecdc" stroke="#4c7c34" stroke-width="1.8"/>
          <text x="765" y="176" fill="#262521" font-size="12" font-weight="600">MINWAS PYROLYSIS</text>
          <text x="765" y="194" fill="#4a5a45" font-size="9.5">400–500°C · + carbon black</text>

          <!-- refineries: part of the loop -->
          <rect x="240" y="240" width="170" height="60" rx="2" fill="#e3ecdc" stroke="#4c7c34" stroke-width="1.8"/>
          <text x="325" y="266" fill="#262521" font-size="12.5" font-weight="600">REFINERIES</text>
          <text x="325" y="284" fill="#4a5a45" font-size="9.5">Feedstock, not fossil fuel</text>

          <!-- oil -->
          <rect x="680" y="240" width="170" height="60" rx="2" fill="#ffffff" stroke="#4c7c34" stroke-width="1.6"/>
          <text x="765" y="266" fill="#262521" font-size="12.5" font-weight="600">PYROLYSIS OIL</text>
          <text x="765" y="284" fill="#666a5f" font-size="9.5">Condensed output</text>

          <!-- industry fuel use: terminal -->
          <rect x="680" y="330" width="170" height="60" rx="2" fill="#f2e9dd" stroke="#8b5a2b" stroke-width="1.6"/>
          <text x="765" y="356" fill="#262521" font-size="12.5" font-weight="600">INDUSTRY — FUEL</text>
          <text x="765" y="374" fill="#8a6a4e" font-size="9.5">Boilers, kilns, furnaces</text>
        </g>
      </svg>
      </div>
      <p style="font-size:0.8rem; font-style:italic;" data-content="loopDiagram.caption"></p>
    </div>
  </section>

  <section class="section">
    <div class="wrap" style="max-width:760px;">
      <div class="eyebrow" data-content="whatWeDo.eyebrow"></div>
      <h2 style="margin-bottom:1rem;" data-content="whatWeDo.title"></h2>
      <p style="font-size:1rem; margin-bottom:1rem;" data-content="whatWeDo.body"></p>
      <a class="btn btn-outline" href="index.html" data-content="whatWeDo.linkLabel"></a>
    </div>
  </section>

  <section class="section section-tint">
    <div class="wrap">
      <h2 style="margin-bottom:0.5rem;" data-content="valuesHeading"></h2>
      <div class="tile-grid">
        <template data-repeat="values">
          <div class="tile"><div class="icon-tile" data-icon="{{icon}}" data-size="22"></div><h3>{{title}}</h3><p>{{desc}}</p></div>
        </template>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="wrap" style="max-width:700px;">
      <div class="eyebrow" data-content="location.eyebrow"></div>
      <h2 style="margin-bottom:1rem;" data-content="location.title"></h2>
      <p data-content="location.body"></p>
    </div>
  </section>

  <section class="section section-tint">
    <div class="wrap" style="max-width:760px;">
      <div class="eyebrow" data-content="story.eyebrow"></div>
      <h2 style="margin-bottom:1rem;" data-content="story.title"></h2>
      <div class="callout">
        <strong>Editable placeholder</strong>
        <span data-content="story.body"></span>
      </div>
    </div>
  </section>

  <section class="section-tight">
    <div class="wrap" style="text-align:center;">
      <h2 style="margin-bottom:1.4rem;" data-content="closingCta.title"></h2>
      <a class="btn btn-primary" href="contact.html" data-content="closingCta.buttonLabel"></a>
    </div>
  </section>
